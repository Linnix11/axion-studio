<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axion Studio, automatisation et IA pour les entreprises</title>
  <meta name="theme-color" content="#2b5ce6">
  <script>
    // Applique tout de suite le thème et les réglages d'accessibilité enregistrés (évite un flash de mauvais thème).
    (function () {
      var p = {}; try { p = JSON.parse(localStorage.getItem('axion-prefs') || '{}') } catch (e) {}
      var r = document.documentElement;
      r.setAttribute('data-theme', p.theme === 'dark' ? 'dark' : 'light');  // clair par défaut
      r.setAttribute('data-text', p.text || 'normal');
      ['contrast', 'font', 'spacing', 'links', 'motion'].forEach(function (k) { if (p[k]) r.setAttribute('data-' + k, 'on'); });
    })();
  </script>
  <meta name="description" content="Axion Studio : conseil et prestations en automatisation des processus et intelligence artificielle pour les entreprises. Workflows automatisés, intégration d’outils, création de sites web.">
  <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Axion Studio",
    "url": "https://axionstudio.fr/",
    "logo": "https://axionstudio.fr/favicon.svg",
    "image": "https://axionstudio.fr/og.png",
    "description": "Automatisation des processus, intelligence artificielle et sites web pour les TPE, PME et indépendants.",
    "founder": { "@type": "Person", "name": "Arthur Champagne-Forterre" },
    "email": "arthur.champagne@icloud.com",
    "telephone": "+33648612350",
    "priceRange": "À partir de 150 €",
    "address": { "@type": "PostalAddress", "postalCode": "95680", "addressLocality": "Montlignon", "addressRegion": "Val-d’Oise", "addressCountry": "FR" },
    "areaServed": [{ "@type": "AdministrativeArea", "name": "Île-de-France" }, { "@type": "Country", "name": "France" }]
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
